name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            generator: Ninja
            cmake_flags: ''
          - name: macos
            os: macos-latest
            generator: Ninja
            cmake_flags: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13
          - name: windows
            os: windows-latest
            generator: Visual Studio 17 2022
            cmake_flags: ''

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build xvfb \
            libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libglu1-mesa-dev mesa-common-dev

      - name: Configure
        run: >
          cmake -B build -G "${{ matrix.generator }}"
          -DCMAKE_BUILD_TYPE=Release
          -DOPENGLITCH_BUILD_TESTS=ON
          -DOPENGLITCH_INSTALL_PLUGIN=OFF
          ${{ matrix.cmake_flags }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a ctest --test-dir build -C Release --output-on-failure
          else
            ctest --test-dir build -C Release --output-on-failure
          fi

      - name: pluginval
        run: |
          curl -sL "https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_${RUNNER_OS}.zip" -o pluginval.zip
          unzip -q -o pluginval.zip -d pluginval-bin
          case "$RUNNER_OS" in
            Linux)   PV=pluginval-bin/pluginval; WRAP="xvfb-run -a" ;;
            macOS)   PV=pluginval-bin/pluginval.app/Contents/MacOS/pluginval; WRAP= ;;
            Windows) PV=pluginval-bin/pluginval.exe; WRAP= ;;
          esac
          $WRAP "$PV" --strictness-level 5 --skip-gui-tests \
            --validate build/OpenGlitch_artefacts/Release/VST3/OpenGlitch.vst3

      - name: Package
        run: cmake --build build --config Release --target openglitch_package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenGlitch-${{ matrix.name }}
          path: build/OpenGlitch-v*.zip
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Check zips match the tag
        run: |
          ls -l dist
          for f in dist/*.zip; do
            case "$(basename "$f")" in
              OpenGlitch-${GITHUB_REF_NAME}-*) ;;
              *) echo "::error::$f does not match tag ${GITHUB_REF_NAME} — bump project(VERSION) in CMakeLists.txt"; exit 1 ;;
            esac
          done

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
